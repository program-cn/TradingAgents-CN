version: '3.8'

# TradingAgents-CN 开发环境配置
# 用于挂载本地代码，实现热重载开发
#
# 使用方法：
#   docker compose -f docker-compose.hub.nginx.yml -f docker-compose.dev.yml up -d
#
# 功能：
#   - 后端：挂载本地 app/ 和 tradingagents/ 目录
#   - 前端：使用 Vite 开发服务器，支持热模块替换（HMR）
#   - 代码修改后立即生效，无需重新构建镜像

services:
  # 后端开发配置
  backend:
    volumes:
      # 🔧 挂载源码目录（覆盖镜像内的代码）
      - ./app:/app/app
      - ./tradingagents:/app/tradingagents
      - ./scripts:/app/scripts
      # 📁 配置和数据目录
      - ./config:/app/config
      - ./logs:/app/logs
      - ./data:/app/data
      # 📚 文档目录（部分功能需要）
      - ./docs:/app/docs
    environment:
      # 🔄 启用开发模式
      - DEBUG=true
      - PYTHONUNBUFFERED=1
      # 📝 日志级别
      - TRADINGAGENTS_LOG_LEVEL=DEBUG
    # 🔧 覆盖启动命令，启用热重载
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # 前端开发配置
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      # 🎨 挂载前端源码
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts
      # 📦 不挂载 node_modules（使用容器内的）
      # - ./frontend/node_modules:/app/frontend/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=/api
      # 🔗 后端 WebSocket 地址（用于实时通知）
      - VITE_WS_URL=ws://localhost:8000
    ports:
      - "5173:5173"  # Vite 开发服务器
    # 🚀 覆盖启动命令
    command: yarn dev --host 0.0.0.0

  # Nginx 配置（开发环境可选）
  nginx:
    volumes:
      # 📝 挂载自定义 Nginx 配置（可选）
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"      # 生产端口
      - "443:443"    # HTTPS 端口（如需配置）
